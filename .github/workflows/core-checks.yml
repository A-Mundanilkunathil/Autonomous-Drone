name: Core checks

on:
  push:
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q ros_ws/src/autonomous_drone/autonomous_drone
      - name: Run ROS-independent unit tests
        env:
          PYTHONPATH: ros_ws/src/autonomous_drone
        run: python -m pytest -q ros_ws/src/autonomous_drone/test
